# Adapter profile for the Reachy Mini platform.
# Copy it next to your deployment and point openrois-adapter-reachy-mini --config at it.

engine:
  id: reachy_mini_1
  platform: reachy-mini
  gateway_url: "ws://127.0.0.1:8765"
  # token: "..."            # when the gateway authenticates (adapter role)

robot:
  simulate: true            # false, or --robot, drives the hardware through the SDK
  time_scale: 1.0           # simulator only: 0 makes motions and speech instantaneous
  # camera_url: "http://reachy-mini.local:8080/whep/camera"   # hardware only

components:
  Navigation:
    speed: 1.0              # scales the duration of every move
  SpeechSynthesis:
    language: en
  PersonDetection:
    poll_interval: 0.5
  FaceDetection:
    poll_interval: 0.5
