name: Release

# Publishes openrois-adapter-reachy-mini to PyPI when a v* tag is pushed, for example
# v0.1.0-alpha.1. PyPI uses trusted publishing (OIDC), so no long-lived token is stored
# in the repository: the PyPI project trusts this workflow in the pypi environment.
# The last job then creates the GitHub release with the wheel and the CHANGELOG section.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Tag matches the package version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versions.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Compare the tag with pyproject.toml
        id: versions
        # The tag carries the npm form (0.1.0-alpha.1), and PyPI normalizes it to 0.1.0a1.
        # beta and rc tags normalize the same way. A tag in the PyPI form (0.1.0a1) would
        # also equal pyproject.toml, and the GitHub release would then be a full release,
        # because the release reads a pre-release from a hyphen. So the form comes first,
        # and it refuses any other label too.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Tag $tag is not in the npm form, for example 0.1.0-alpha.1"
            exit 1
          fi
          py_version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          py_expected=$(sed -E -e 's/-alpha\./a/' -e 's/-beta\./b/' -e 's/-rc\./rc/' <<< "$tag")
          if [ "$py_version" != "$py_expected" ]; then
            echo "::error::Tag $tag, PyPI $py_version (expected $py_expected)"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "pypi=$py_version" >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        # This runs before anything is uploaded, so a missing CHANGELOG section stops the
        # release while the version is still free on PyPI.
        env:
          PY_VERSION: ${{ steps.versions.outputs.pypi }}
        run: python3 .github/scripts/release_notes.py CHANGELOG.md "$PY_VERSION" > release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  pypi:
    name: PyPI
    needs: check-version
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        # The OpenRoIS packages, the gateway included, come from PyPI.
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      - name: Test on the stand-in SDK
        run: pytest -q

      - name: Build
        run: |
          python -m pip install build
          python -m build

      - name: The wheel installs from PyPI
        # This resolves the OpenRoIS packages from the registry, so a floor that PyPI
        # cannot satisfy stops the release before anything is uploaded.
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python -c "import openrois.components.reachy_mini, openrois_adapter_reachy_mini"
          /tmp/clean/bin/openrois-adapter-reachy-mini --help

      # The release carries the wheel that passed the clean install. It is stored before the
      # publish, and the sdist stays on PyPI.
      - uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: [check-version, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create or update the release
        # A version with a hyphen, such as 0.1.0-alpha.1, is a pre-release.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Reachy Mini adapter ${{ needs.check-version.outputs.version }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          notes=artifacts/release-notes/release-notes.md
          shopt -s nullglob
          wheels=(artifacts/wheel/*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "::error::No wheel to attach"
            exit 1
          fi

          # A rerun, or a release made by hand, already exists and must not fail the job.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "$TITLE" \
              --notes-file "$notes" \
              --prerelease="$prerelease"
            gh release upload "$GITHUB_REF_NAME" "${wheels[@]}" --clobber
          else
            # The tag push started this run, so --verify-tag only ever refuses a tag that
            # was deleted since, and never lets gh create one.
            gh release create "$GITHUB_REF_NAME" "${wheels[@]}" \
              --verify-tag \
              --title "$TITLE" \
              --notes-file "$notes" \
              --prerelease="$prerelease"
          fi
